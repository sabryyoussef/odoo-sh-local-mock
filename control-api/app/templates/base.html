<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ brand.product_name if brand is defined else 'Mock Odoo.sh' }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  {% if brand is defined and brand.css_href %}
    <link rel="stylesheet" href="{{ brand.css_href }}">
  {% endif %}
</head>
<body class="{% if brand is defined and brand.body_theme_class %}{{ brand.body_theme_class }} {% endif %}{% block body_class %}{% endblock %}">
  {% block top %}
    {% if project is defined and project %}
      {% include "partials/top_nav.html" %}
    {% endif %}
  {% endblock %}
  <div class="{% block shell_class %}app-shell{% endblock %}">
    {% block shell %}{% endblock %}
  </div>
  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
