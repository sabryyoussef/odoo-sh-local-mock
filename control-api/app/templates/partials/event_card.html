<article class="event-card" role="listitem" data-event-id="{{ event.id }}">
  <div class="event-card__rail" aria-hidden="true">
    <span class="event-card__node"></span>
  </div>
  <div class="event-card__body">
    <header class="event-card__header">
      <div class="event-card__author">
        <span class="avatar">{{ event.avatar_initials }}</span>
        <div>
          <div class="event-card__author-label">{{ event.author_label }}</div>
          <time class="event-card__time">{{ event.relative_time }}</time>
        </div>
      </div>
      <div class="event-card__meta">
        <span class="badge badge--{{ event.status }}">{{ event.status_label }}</span>
        {% if event.action_style == 'connect' %}
          <a class="btn btn--sm btn--connect" href="{{ event.connect_href }}">CONNECT</a>
        {% else %}
          <span class="btn btn--sm btn--dropped">{{ event.action }}</span>
        {% endif %}
      </div>
    </header>
    <h3 class="event-card__title">
      <a href="{{ event.build_href }}">{{ event.title }}</a>
    </h3>
    <p class="event-card__message">{{ event.body }}</p>
    <p class="event-card__more"><a href="{{ event.build_href }}">Open Build #{{ event.build_id }} →</a></p>
  </div>
</article>
