<section class="features" id="features">
  <div class="features__inner">
    <h2 class="features__title">{{ brand.feature_title }}</h2>
    <p class="features__lead">{{ brand.feature_lead }}</p>
    <div class="features__grid">
      {% for card in brand.features %}
        <article class="feature-card">
          <h3>{{ card.title }}</h3>
          <p>{{ card.body }}</p>
        </article>
      {% endfor %}
    </div>
  </div>
</section>
