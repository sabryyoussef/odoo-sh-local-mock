<section class="hero hero--decision" aria-label="{{ t('hero.aria') }}">
  <div class="hero__content">
    {% if brand.theme_id == 'helpers_erp' %}
      <p class="hero__eyebrow">{{ t('hero.eyebrow') }}</p>
    {% else %}
      <p class="hero__eyebrow">{{ t('hero.eyebrow_default') }}</p>
    {% endif %}
    <h1 class="hero__title">{{ t('hero.title') }}</h1>
    <p class="hero__subtitle">{{ t('hero.subtitle') }}</p>
    <div class="hero__actions">
      <a class="btn-hero btn-hero--primary" href="#decision-paths">{{ t('nav.try_free') }}</a>
    </div>
    {% if brand.powered_by %}
      <p class="prepared-for">{{ brand.powered_by }}</p>
    {% endif %}
  </div>
</section>
