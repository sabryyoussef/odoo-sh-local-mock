<header class="projects-topbar">
  <a class="projects-topbar__brand brand-mark" href="/">
    {% if brand.logo_mark %}
      <img class="brand-mark__logo" src="{{ brand.logo_mark }}" alt="">
    {% else %}
      <span class="projects-topbar__mark" aria-hidden="true">◆</span>
    {% endif %}
    <span class="brand-mark__text">
      <span class="projects-topbar__name brand-mark__product">{{ brand.short_name }}</span>
    </span>
  </a>
  <nav class="projects-topbar__right" aria-label="Customer navigation">
    <a class="projects-topbar__home" href="/">Home</a>
    <a class="projects-topbar__home" href="/solutions">Solutions</a>
    <a class="projects-topbar__home" href="/platform">Developer Platform</a>
    <a class="projects-topbar__home" href="/pricing">Pricing</a>
    {% if user and user.github_connected %}
      <a class="projects-topbar__home" href="/portal">Customer Portal</a>
      <a class="projects-topbar__home" href="/projects">Projects</a>
      <a class="projects-topbar__home" href="/logout">Logout</a>
    {% else %}
      <a class="projects-topbar__home" href="/login?next=/portal">Sign in</a>
    {% endif %}
  </nav>
</header>
