# FreePool local gateway — freellmpool OpenAI-compatible proxy
# Security: binds 127.0.0.1 only; use `freellmpool tailnet serve` for remote Hermes.

services:
  freepool-proxy:
    image: ghcr.io/0xzr/freellmpool:0.13.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FREELLMPOOL_ROUTING: ${FREELLMPOOL_ROUTING:-spread}
      FREELLMPOOL_PROXY_KEY: ${FREEPOOL_PROXY_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
    command: ["proxy", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/models')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
